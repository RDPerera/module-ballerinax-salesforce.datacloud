name: Trivy

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

concurrency:
  # No workflows can run parallel as these are run against the same system
  group: ${{ github.repository }}
  cancel-in-progress: true

jobs:
  call_workflow:
    name: Run Security Scan Workflow
    if: ${{ github.repository_owner == 'ballerina-platform' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ballerina-platform/ballerina-library/.github/workflows/security-scan-template.yml@main
    secrets: inherit
    with:
      # The examples resolve the connector from the local repository, which this workflow doesn't build.
      # Turn the examples scan back on once they can resolve a version released to Central (they scan clean
      # locally with bal scan 0.12.0).
      scan-examples: false
